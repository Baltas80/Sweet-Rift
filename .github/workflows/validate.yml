name: Validate Sweet Rift

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  godot-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Godot 4.6 stable
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip -d godot
          chmod +x godot/Godot_v4.6-stable_linux.x86_64
      - name: Validate project
        run: ./godot/Godot_v4.6-stable_linux.x86_64 --headless --editor --path . --quit
